name: Publish Release

# Triggered when the private source repo CI pushes a tag and the release
# artifacts via SSH. Turns the pushed `releases/<tag>/` directory into a
# proper GitHub Release on this repo.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Validate tag format defensively (TAG comes from github.ref_name).
          # Allows an optional pre-release suffix (e.g. v1.0.64-rc.5) used by
          # dispatch test builds; those are published as GitHub pre-releases so
          # /releases/latest (the fleet auto-updater's source) ignores them.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match expected format vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          # A pre-release suffix (anything after a hyphen) means: do NOT make
          # this the 'latest' release the fleet pulls.
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          DIR="releases/${TAG}"
          if [ ! -d "$DIR" ]; then
            echo "::error::No artifacts directory at $DIR"
            ls -la releases/ 2>/dev/null || echo "(no releases/ directory)"
            exit 1
          fi
          # As of v1.0.46 the source repo publishes a single Inno Setup
          # installer .exe instead of an RMM_*.zip. Prefer the .exe; fall
          # back to the old zip pattern so older tags (if ever re-tagged)
          # still re-publish cleanly.
          mapfile -t exes < <(find "$DIR" -maxdepth 1 -name 'EarneyITSupportSetup-*.exe' -type f)
          mapfile -t zips < <(find "$DIR" -maxdepth 1 -name 'RMM_*.zip' -type f)
          ARTIFACT=""
          if [ "${#exes[@]}" -eq 1 ]; then
            ARTIFACT="${exes[0]}"
          elif [ "${#zips[@]}" -eq 1 ]; then
            ARTIFACT="${zips[0]}"
          else
            echo "::error::Expected exactly one EarneyITSupportSetup-*.exe (preferred) or RMM_*.zip in $DIR"
            echo "::error::Found: ${#exes[@]} installer EXE(s), ${#zips[@]} zip(s)"
            exit 1
          fi
          SHA="$DIR/SHA256SUMS"
          if [ ! -f "$SHA" ]; then
            echo "::error::Missing $SHA"
            exit 1
          fi
          NOTES=$(printf 'Automated release of Earney IT Support %s.\n\nDownload `%s` and run it on a Windows machine to install or update.\nSHA-256 sums of the attached artifacts are in `SHA256SUMS`.' "$TAG" "$(basename "$ARTIFACT")")
          gh release create "$TAG" "$ARTIFACT" "$SHA" --title "$TAG" --notes "$NOTES" $PRERELEASE
